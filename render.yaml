services:
  - type: web
    name: third-opinion-routing
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: DATABASE_PATH
        value: /tmp/third_opinion.sqlite3
